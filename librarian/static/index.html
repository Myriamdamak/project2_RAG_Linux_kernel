<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Librarian · Linux kernel docs</title>
<style>
:root{
  --bg:#f6f4ef; --paper:#fffdf8; --ink:#1d1b17; --muted:#6b665c; --line:#e3ddd0;
  --accent:#1f5f4a; --accent-soft:#e3efe9; --warn:#8a4b0f; --warn-soft:#fbefe1;
  --mono:ui-monospace,"JetBrains Mono",SFMono-Regular,Menlo,monospace;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#15140f; --paper:#1d1c17; --ink:#ece8de; --muted:#a29c8f; --line:#34322a;
  --accent:#7cc4a6; --accent-soft:#1f2e28; --warn:#f0b878; --warn-soft:#2e2418;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans)}
main{max-width:860px;margin:0 auto;padding:40px 16px 80px}
header h1{font:600 34px/1.1 var(--serif);margin:0 0 6px;letter-spacing:-.01em}
header p{margin:0;color:var(--muted)}
header .meta{font:12px var(--mono);color:var(--muted);margin-top:10px}
form{margin:28px 0 12px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
textarea{width:100%;min-height:76px;resize:vertical;padding:14px 16px;font:17px/1.4 var(--sans);
  background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:10px}
textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
select,button{font:14px var(--sans);padding:9px 12px;border-radius:8px;border:1px solid var(--line);
  background:var(--paper);color:var(--ink)}
button.primary{background:var(--accent);color:var(--paper);border-color:var(--accent);font-weight:600;padding:9px 18px;cursor:pointer}
button.primary:disabled{opacity:.6;cursor:progress}
.examples{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.examples button{font-size:13px;color:var(--muted);cursor:pointer;border-style:dashed}
.answer{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:22px 24px;margin-top:14px}
.answer .text{font:18px/1.6 var(--serif);white-space:pre-wrap}
.answer.idk{border-color:var(--warn);background:var(--warn-soft)}
.answer pre{font:13px/1.45 var(--mono);background:var(--bg);padding:10px 12px;border-radius:8px;overflow:auto;white-space:pre}
sup.cite{font:600 11px var(--mono);color:var(--accent);background:var(--accent-soft);padding:1px 5px;border-radius:5px;cursor:pointer;margin-left:1px}
.stats{font:12px var(--mono);color:var(--muted);margin-top:14px;display:flex;gap:14px;flex-wrap:wrap}
.feedback{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.feedback span{color:var(--muted);font-size:14px}
.feedback button{cursor:pointer}
.feedback input{flex:1;min-width:180px;font:14px var(--sans);padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
h2{font:600 14px var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:30px 0 10px}
.src{background:var(--paper);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
.src.flash{outline:2px solid var(--accent)}
.src summary{list-style:none;cursor:pointer;padding:11px 14px;display:flex;gap:10px;align-items:baseline}
.src summary::-webkit-details-marker{display:none}
.src .n{font:600 12px var(--mono);color:var(--accent);min-width:26px}
.src .path{font:13px var(--mono);word-break:break-all}
.src .sec{color:var(--muted);font-size:13px}
.src .badge{margin-left:auto;font:11px var(--mono);color:var(--muted);white-space:nowrap}
.src.cited .badge{color:var(--accent)}
.src .body{padding:0 14px 14px 50px;font:13px/1.5 var(--mono);white-space:pre-wrap;color:var(--muted)}
.src .body a{color:var(--accent)}
.error{color:var(--warn)}
footer{margin-top:50px;font-size:13px;color:var(--muted)}
@media (max-width:560px){header h1{font-size:27px}.src .body{padding-left:14px}}
</style>
</head>
<body>
<main>
<header>
  <h1>The Librarian</h1>
  <p>Ask the Linux kernel documentation. Every answer cites the passage it came from.</p>
  <div class="meta" id="meta">loading index…</div>
</header>

<form id="f">
  <textarea id="q" placeholder="e.g. What does vm.swappiness control, and what is its default?" required></textarea>
  <div class="row">
    <select id="sub" aria-label="Limit to a subsystem"><option value="">All of Documentation/</option></select>
    <select id="dtype" aria-label="Limit to a document type">
      <option value="">All document types</option><option value="rst">Guides (.rst)</option>
      <option value="txt">Legacy text (.txt)</option><option value="abi">sysfs ABI</option>
    </select>
    <button class="primary" id="go" type="submit">Ask</button>
  </div>
</form>
<div class="examples" id="ex"></div>

<div id="out"></div>

<footer id="foot">Answers come only from the indexed documentation. If a source is wrong, tell us below an answer — that feedback is how this project is graded.</footer>
</main>

<script>
const $ = s => document.querySelector(s);
const EXAMPLES = [
  "How do I enable the magic SysRq key at runtime?",
  "What is the difference between cgroup v1 and v2 memory.high?",
  "Which email client settings are needed to send patches?",
  "What does /sys/kernel/mm/transparent_hugepage/enabled accept?",
  "What is the kernel's coding style rule on indentation?",
];
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderAnswer(text){
  // fenced code first, then citations inside prose only
  return text.split("```").map((part,i) => {
    if (i % 2) return `<pre>${esc(part.replace(/^\w*\n/,""))}</pre>`;
    return esc(part).replace(/\[(\d+)\]/g, (_,n)=>`<sup class="cite" data-n="${n}" title="Show source ${n}">${n}</sup>`);
  }).join("");
}

async function init(){
  EXAMPLES.forEach(e=>{const b=document.createElement("button");b.type="button";b.textContent=e;
    b.onclick=()=>{$("#q").value=e;$("#f").requestSubmit()};$("#ex").append(b)});
  try{
    const h = await (await fetch("/api/health")).json();
    $("#meta").textContent = `kernel ${h.kernel} · ${h.chunks.toLocaleString()} passages · ${h.embedder} · rerank ${h.reranker} · ${h.generator}`;
    const subs = await (await fetch("/api/subsystems")).json();
    subs.forEach(s=>{const o=document.createElement("option");o.value=s.name;o.textContent=`${s.name} (${s.chunks})`;$("#sub").append(o)});
  }catch(e){ $("#meta").textContent = "service unavailable"; }
}

$("#f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const question = $("#q").value.trim(); if(!question) return;
  $("#go").disabled = true; $("#go").textContent = "Searching…";
  $("#out").innerHTML = "";
  try{
    const r = await fetch("/api/ask",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({question, filters:{subsystem:$("#sub").value, doc_type:$("#dtype").value}})});
    const d = await r.json();
    if(!r.ok) throw new Error(d.detail || d.error);
    show(d);
  }catch(e){ $("#out").innerHTML = `<p class="error">${esc(String(e.message||e))}</p>`; }
  $("#go").disabled = false; $("#go").textContent = "Ask";
});

function show(d){
  const t = d.timings_ms;
  const stats = [`${Math.round(t.total)} ms`, d.cost_usd ? `$${d.cost_usd.toFixed(5)}` : "no LLM cost",
    d.reranked ? "reranked" : "not reranked", d.queries.length>1 ? `${d.queries.length} queries` : null,
    d.cached ? "cached" : null].filter(Boolean);
  $("#out").innerHTML = `
  <div class="answer ${d.idk?"idk":""}">
    <div class="text">${renderAnswer(d.answer)}</div>
    <div class="stats">${stats.map(s=>`<span>${s}</span>`).join("")}</div>
    <div class="feedback" id="fb">
      <span>Was this right?</span>
      <button data-v="up">Correct</button><button data-v="down">Wrong</button>
      <button data-v="wrong_source">Right answer, wrong source</button>
      <input id="fbc" placeholder="Optional: what should it have said?">
    </div>
  </div>
  <h2>Sources</h2>
  ${d.sources.map(s=>`
    <details class="src ${s.cited?"cited":""}" id="src-${s.n}">
      <summary><span class="n">[${s.n}]</span>
        <span><span class="path">${esc(s.path)}</span><br><span class="sec">${esc(s.section)}</span></span>
        <span class="badge">${s.cited?"cited":"retrieved"}${s.rerank_score!=null?` · ${s.rerank_score.toFixed(1)}`:""}</span></summary>
      <div class="body">${esc(s.text)}\n\n<a href="${s.url}" target="_blank" rel="noopener">Open on GitHub ↗</a></div>
    </details>`).join("")}`;
  document.querySelectorAll("sup.cite").forEach(el=>el.onclick=()=>{
    const s=$("#src-"+el.dataset.n); if(!s) return; s.open=true; s.scrollIntoView({behavior:"smooth",block:"center"});
    s.classList.add("flash"); setTimeout(()=>s.classList.remove("flash"),1200)});
  document.querySelectorAll("#fb button").forEach(b=>b.onclick=async()=>{
    await fetch("/api/feedback",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({id:d.id, verdict:b.dataset.v, comment:$("#fbc").value})});
    $("#fb").innerHTML = "<span>Thanks — logged.</span>";
  });
}
init();
</script>
</body>
</html>
